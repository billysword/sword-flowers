{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sword Flowers</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.125rem;
      line-height: 1.7;
      color: #1a1a1a;
      background: #fafaf8;
    }

    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #e0e0d8;
    }

    header a {
      font-size: 1.25rem;
      font-weight: bold;
      color: inherit;
      text-decoration: none;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
    }

    a { color: #2a5db0; }
    a:visited { color: #6b4c9a; }

    h1 { margin-top: 0; line-height: 1.3; }

    ul { padding-left: 1.25rem; }
    li { margin-bottom: 0.4rem; }

    article h1 { margin-bottom: 0.25rem; }
    .body { margin-top: 1.5rem; }
    .body p { margin: 0 0 1.25rem; }
  </style>
</head>
<body>
  <header>
    <a href="/posts">Sword Flowers</a>
  </header>
  <main>
    {{block "content" .}}{{end}}
  </main>
</body>
</html>
{{end}}
