{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sword Flowers</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.125rem;
      line-height: 1.7;
      color: #1a1a1a;
      background: #fafaf8;
    }

    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #e0e0d8;
    }

    header a {
      font-size: 1.25rem;
      font-weight: bold;
      color: inherit;
      text-decoration: none;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
    }

    a { color: #2a5db0; }
    a:visited { color: #6b4c9a; }

    h1 { margin-top: 0; line-height: 1.3; }

    ul { padding-left: 1.25rem; }
    li { margin-bottom: 0.4rem; }

    article h1 { margin-bottom: 0.25rem; }
    .body { margin-top: 1.5rem; }
    .body p { margin: 0 0 1.25rem; }
    img { max-width: 100%; height: auto; display: block; margin-bottom: 1.5rem; }
    .preview { max-height: 200px; width: auto; }

    .admin-header { display: flex; justify-content: space-between; align-items: baseline; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #e0e0d8; }
    th { font-size: 0.875rem; color: #555; }

    .status { font-size: 0.8rem; padding: 0.15rem 0.5rem; border-radius: 3px; }
    .status--published { background: #d4edda; color: #155724; }
    .status--draft     { background: #fff3cd; color: #856404; }

    .actions { display: flex; gap: 0.75rem; align-items: center; }
    .actions form { margin: 0; }
    .actions button { background: none; border: none; padding: 0; color: #c0392b; cursor: pointer; font-size: 1rem; }
    .actions button:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <a href="/posts">Sword Flowers</a>
  </header>
  <main>
    {{block "content" .}}{{end}}
  </main>
</body>
</html>
{{end}}
