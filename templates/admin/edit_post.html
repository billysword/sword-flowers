{{define "content"}}
<h1>Edit Post</h1>
<form method="POST" action="/admin/posts/{{.Slug}}" enctype="multipart/form-data">
  <div class="field">
    <label for="subject">Subject</label>
    <input type="text" id="subject" name="subject" value="{{.Subject}}" required autofocus>
  </div>
  <div class="field">
    <label for="body">Body</label>
    <textarea id="body" name="body" rows="16" required>{{.Body}}</textarea>
  </div>
  {{if .ImageRef}}
  <div class="field">
    <label>Current cover image</label>
    <img src="{{.ImageRef}}" alt="{{.Subject}}" class="preview">
  </div>
  {{end}}
  <div class="field">
    <label for="image">{{if .ImageRef}}Replace cover image{{else}}Cover image (optional){{end}}</label>
    <input type="file" id="image" name="image" accept="image/*">
  </div>
  {{if .Gallery}}
  <div class="field">
    <label>Gallery</label>
    <div class="gallery-edit">
      {{range .Gallery}}
      <div class="gallery-edit-item">
        <img src="{{.ImageRef}}" alt="{{.Caption}}" class="preview">
        <input type="text" name="caption_{{.ID}}" value="{{.Caption}}" placeholder="Caption (optional)">
        <label><input type="checkbox" name="delete_image_{{.ID}}" value="1"> Delete</label>
      </div>
      {{end}}
    </div>
  </div>
  {{end}}
  <div class="field">
    <label for="gallery">Add more photos</label>
    <input type="file" id="gallery" name="gallery" accept="image/*" multiple>
  </div>
  <div class="field">
    <fieldset>
      <legend>Status</legend>
      <label><input type="radio" name="status" value="draft" {{if eq .Status "draft"}}checked{{end}}> Draft</label>
      <label><input type="radio" name="status" value="published" {{if eq .Status "published"}}checked{{end}}> Published</label>
    </fieldset>
  </div>
  <button type="submit">Save changes</button>
</form>
{{end}}
