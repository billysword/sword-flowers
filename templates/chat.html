<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sword flowers</title>
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body>

<div id="messages">
  {{range .Messages}}
  <div class="msg msg-{{.Role}}">{{.Content}}</div>
  {{else}}
  <div class="msg msg-assistant">terminal ready.</div>
  {{end}}
</div>

<div id="input-bar">
  <span class="prompt-char">&gt;</span>
  <input type="text" id="msg-input" autocomplete="off" autofocus
         placeholder="ask anything...">
  <button id="send-btn" type="button">send</button>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('msg-input');
  const sendBtn    = document.getElementById('send-btn');

  function setEnabled(on) {
    inputEl.disabled  = !on;
    sendBtn.disabled  = !on;
    if (on) inputEl.focus();
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    setEnabled(false);

    // Append the user's message immediately — no round-trip needed.
    const userDiv = document.createElement('div');
    userDiv.className = 'msg msg-user';
    userDiv.textContent = text;
    messagesEl.appendChild(userDiv);

    // Placeholder assistant bubble with a blinking cursor.
    const aiDiv    = document.createElement('div');
    aiDiv.className = 'msg msg-assistant';
    const cursor   = document.createElement('span');
    cursor.className = 'cursor';
    aiDiv.appendChild(cursor);
    messagesEl.appendChild(aiDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    let accum = '';

    try {
      const resp = await fetch('/chat', {
        method:  'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body:    'message=' + encodeURIComponent(text),
      });

      if (!resp.ok) {
        aiDiv.textContent = '[error ' + resp.status + ']';
        return;
      }

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let   buf     = '';

      while (true) {
        const {done, value} = await reader.read();
        if (done) break;

        buf += decoder.decode(value, {stream: true});

        // SSE frames are separated by double newline.
        const frames = buf.split('\n\n');
        buf = frames.pop(); // keep trailing incomplete frame

        for (const frame of frames) {
          if (!frame.startsWith('data: ')) continue;
          const payload = frame.slice(6).trim();
          if (payload === '[DONE]') { reader.cancel(); break; }

          try {
            // Each payload is a JSON-encoded string so that embedded newlines
            // in Claude's output don't break SSE framing on the server side.
            const token = JSON.parse(payload);
            accum += token;
            // Set textContent (not innerHTML) to avoid XSS from LLM output,
            // then re-attach cursor so it stays at the trailing position.
            aiDiv.textContent = accum;
            aiDiv.appendChild(cursor);
            messagesEl.scrollTop = messagesEl.scrollHeight;
          } catch (_) { /* ignore malformed frame */ }
        }
      }
    } catch (err) {
      aiDiv.textContent = '[network error]';
    } finally {
      cursor.remove();
      if (accum) aiDiv.textContent = accum;
      setEnabled(true);
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  // Enter submits; Shift+Enter reserved for future multi-line support.
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
</script>

</body>
</html>
