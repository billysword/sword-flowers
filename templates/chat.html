<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sword flowers</title>
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body>

<div id="messages">
  {{range .Messages}}
  <div class="msg msg-{{.Role}}">{{.Content}}</div>
  {{else}}
  <div class="msg msg-assistant">terminal ready.</div>
  {{end}}
</div>

<div id="input-bar">
  <span class="prompt-char">&gt;</span>
  <input type="text" id="msg-input" autocomplete="off" autofocus
         placeholder="ask anything...">
  <button id="send-btn" type="button">send</button>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('msg-input');
  const sendBtn    = document.getElementById('send-btn');

  function setEnabled(on) {
    inputEl.disabled  = !on;
    sendBtn.disabled  = !on;
    if (on) inputEl.focus();
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    setEnabled(false);

    // Append the user's message immediately — no round-trip needed.
    const userDiv = document.createElement('div');
    userDiv.className = 'msg msg-user';
    userDiv.textContent = text;
    messagesEl.appendChild(userDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    // aiDiv and cursor are created lazily on the first text token.
    // Widget responses inject their own elements and may produce no text at all.
    let aiDiv  = null;
    let accum  = '';
    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    function getOrCreateAiDiv() {
      if (!aiDiv) {
        aiDiv = document.createElement('div');
        aiDiv.className = 'msg msg-assistant';
        aiDiv.appendChild(cursor);
        messagesEl.appendChild(aiDiv);
      }
      return aiDiv;
    }

    try {
      const resp = await fetch('/chat', {
        method:  'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body:    'message=' + encodeURIComponent(text),
      });

      if (!resp.ok) {
        getOrCreateAiDiv().textContent = '[error ' + resp.status + ']';
        return;
      }

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let   buf     = '';

      while (true) {
        const {done, value} = await reader.read();
        if (done) break;

        buf += decoder.decode(value, {stream: true});

        // SSE frames are separated by double newline.
        const frames = buf.split('\n\n');
        buf = frames.pop(); // keep trailing incomplete frame

        for (const frame of frames) {
          // Parse event type and data line from the frame.
          let eventType = 'text';
          let dataLine  = null;
          for (const line of frame.split('\n')) {
            if (line.startsWith('event: ')) { eventType = line.slice(7).trim(); continue; }
            if (line.startsWith('data: '))  { dataLine  = line.slice(6).trim(); }
          }
          if (!dataLine) continue;
          if (dataLine === '[DONE]') { reader.cancel(); break; }

          try {
            if (eventType === 'widget') {
              // Widget HTML is server-generated; innerHTML is safe here.
              const widgetEl = document.createElement('div');
              widgetEl.innerHTML = JSON.parse(dataLine);
              messagesEl.appendChild(widgetEl);
            } else {
              // Text token — JSON-encoded string to survive embedded newlines.
              const token = JSON.parse(dataLine);
              accum += token;
              // textContent prevents XSS from LLM output; re-attach cursor after update.
              getOrCreateAiDiv().textContent = accum;
              aiDiv.appendChild(cursor);
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
          } catch (_) { /* ignore malformed frame */ }
        }
      }
    } catch (err) {
      getOrCreateAiDiv().textContent = '[network error]';
    } finally {
      cursor.remove();
      if (aiDiv && accum) aiDiv.textContent = accum;
      setEnabled(true);
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  // Enter submits; Shift+Enter reserved for future multi-line support.
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
</script>

</body>
</html>
